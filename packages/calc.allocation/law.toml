# Манифест §10 — маркер корня пакета (DECISION-0033). Заголовки §22 в самих
# `.law` обязаны совпадать с этим именем (LDC-E1109, lawc check).
#
# ВЫЧИСЛИТЕЛЬНЫЙ пакет (DECISION-0123): нормативного источника у него нет,
# юрисдикции нет, правового статуса нет. Каталожная секция `[metadata]`
# DECISION-0051 описывает АКТ и здесь намеренно отсутствует — подставить
# `jurisdiction`/`instrument`/`legalStatus` значило бы объявить общий
# алгоритм нормативным актом. Ворота `check_package_metadata.py` читают
# только `corpus/laws/`, поэтому отсутствие секции их не касается.
[package]
name = "calc.allocation"
version = "0.1.0"
language = "0.2"
namespace = "urn:law:calc:allocation"

[features]
semanticLayer = "L1"

[[tests]]
family = "calc.allocation#authored"
regression = false
suites = [
    "tests/01-proportional-equal-weights-priority.lawtest",
    "tests/02-proportional-equal-weights-unresolved-tie.lawtest",
    "tests/03-unresolved-tie-blocks-settlement.lawtest",
    "tests/04-proportional-withheld-remainder.lawtest",
    "tests/05-largest-remainder-order.lawtest",
    "tests/06-zero-fraction-never-takes-a-unit.lawtest",
    "tests/07-second-unit-goes-to-priority-two.lawtest",
    "tests/08-sequential-partial-class-pro-rata.lawtest",
    "tests/09-sequential-last-class-gets-nothing.lawtest",
    "tests/10-sequential-first-class-paid-in-full.lawtest",
    "tests/11-sequential-surplus-is-remainder.lawtest",
    "tests/12-sequential-pro-rata-tie-by-priority.lawtest",
    "tests/13-defect-unit-not-minimal.lawtest",
    "tests/14-defect-foreign-input.lawtest",
    "tests/15-defect-mode-missing.lawtest",
    "tests/16-defect-withholds-settlement.lawtest",
    "tests/17-defect-total-not-representable.lawtest",
]

[authoring]
local_imports = "explicit"
