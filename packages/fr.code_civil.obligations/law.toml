# Manifeste §10 — racine du paquet (DECISION-0033). Les en-têtes §22 des
# fichiers .law font foi ; le manifeste doit y correspondre (LDC-E1109).
[package]
name = "fr.code_civil.obligations"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:code-civil-obligations"

# Métadonnées de catalogue (DECISION-0051 ; docs/PACKAGE-METADATA.ru.md).
[metadata]
act = "fr-code-civil-obligations"
title = "Code civil — Livre III, titres IV et IV bis : régime général des obligations (modalités, opérations, actions du créancier, extinction, restitutions) et preuve des obligations"
primarySource = "CODE_CIVIL"
jurisdiction = "FR"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "République française ; données ouvertes LEGI diffusées par la DILA"
verifiedAgainstSource = true

# Importations §23 (E-0122) : le concentrateur des personnes et de la créance,
# et les corridors transitoires des réformes de 2016 et de 2018.
[dependencies]
"fr.code_civil.core" = "0.1.0"
"fr.code_civil.transitions" = "0.1.0"

