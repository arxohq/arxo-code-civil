# Manifeste §10 — racine du paquet (DECISION-0033). Les en-têtes §22 des
# fichiers .law font foi ; le manifeste doit y correspondre (LDC-E1109).
[package]
name = "fr.code_civil.liberalites"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:code-civil-liberalites"

# Métadonnées de catalogue (DECISION-0051 ; docs/PACKAGE-METADATA.ru.md).
[metadata]
act = "fr-code-civil-liberalites"
title = "Code civil — Livre III, titre II : des libéralités (réserve héréditaire, quotité disponible, réunion fictive, imputation et réduction des libéralités excessives)"
primarySource = "CODE_CIVIL"
jurisdiction = "FR"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "République française ; données ouvertes LEGI diffusées par la DILA"
verifiedAgainstSource = true

# Importations §23 (E-0122) : le concentrateur des personnes et la dévolution
# légale (nombre d'enfants laissés, conjoint successible, fractions).
[dependencies]
"fr.code_civil.core" = "0.1.0"
"fr.code_civil.successions" = "0.1.0"

