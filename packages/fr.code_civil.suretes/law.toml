# Manifeste §10 — racine du paquet (DECISION-0033). Les en-têtes §22 des
# fichiers .law font foi ; le manifeste doit y correspondre (LDC-E1109).
[package]
name = "fr.code_civil.suretes"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:code-civil-suretes"

# Métadonnées de catalogue (DECISION-0051 ; docs/PACKAGE-METADATA.ru.md).
[metadata]
act = "fr-code-civil-suretes"
title = "Code civil — Livre IV : des sûretés (cautionnement, garantie autonome, lettre d'intention, privilèges, gage, nantissement, propriété retenue ou cédée à titre de garantie, gage immobilier, hypothèques, fiducie-sûreté, agent des sûretés)"
primarySource = "CODE_CIVIL"
jurisdiction = "FR"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "République française ; données ouvertes LEGI diffusées par la DILA"
verifiedAgainstSource = true

# Importations §23 (E-0122) : le concentrateur (personnes, biens, créances),
# le corridor de l'ordonnance n° 2021-1192 (article 37) et le calculateur de
# répartition par rangs (DECISION-0123, P04).
[dependencies]
"fr.code_civil.core" = "0.1.0"
"fr.code_civil.transitions" = "0.1.0"
"calc.allocation" = "0.1.0"

