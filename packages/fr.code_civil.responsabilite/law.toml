# Manifeste §10 — racine du paquet (DECISION-0033). Les en-têtes §22 des
# fichiers .law font foi ; le manifeste doit y correspondre (LDC-E1109).
[package]
name = "fr.code_civil.responsabilite"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:code-civil-responsabilite"

# Métadonnées de catalogue (DECISION-0051 ; docs/PACKAGE-METADATA.ru.md).
[metadata]
act = "fr-code-civil-responsabilite"
title = "Code civil — Livre III, titre III, sous-titres II et III : la responsabilité extracontractuelle (faute, fait des choses, fait d'autrui, produits défectueux, préjudice écologique, troubles de voisinage) et les autres sources d'obligations (gestion d'affaires, paiement de l'indu, enrichissement injustifié)"
primarySource = "CODE_CIVIL"
jurisdiction = "FR"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "République française ; données ouvertes LEGI diffusées par la DILA"
verifiedAgainstSource = true

# Importations §23 (E-0122) : le concentrateur des personnes et des biens.
[dependencies]
"fr.code_civil.core" = "0.1.0"

# Scénarios déclaratifs (DECISION-0127). Chaque appréciation déléguée au juge
