# Manifeste §10 — racine du paquet (DECISION-0033). Les en-têtes §22 des
# fichiers .law font foi ; le manifeste doit y correspondre (LDC-E1109).
[package]
name = "fr.code_civil.famille"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:code-civil-famille"

# Métadonnées de catalogue (DECISION-0051 ; docs/PACKAGE-METADATA.ru.md).
[metadata]
act = "fr-code-civil-famille"
title = "Code civil — Livre Ier, titres V à IX, XIII et XIV : mariage (âge, consentement, empêchements de parenté, nullités), divorce et séparation de corps, filiation (présomption de paternité, période légale de conception, contestation), adoption, autorité parentale, pacte civil de solidarité, ordonnance de protection"
primarySource = "CODE_CIVIL"
jurisdiction = "FR"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "République française ; données ouvertes LEGI diffusées par la DILA"
verifiedAgainstSource = true

# Importations §23 (E-0122) : le concentrateur des personnes et le calculateur
# de parenté par graphe — les empêchements des articles 161 à 163 et 515-2
# se lisent en degrés et en lignes, non en faits plats.
[dependencies]
"fr.code_civil.core" = "0.1.0"
"calc.kinship" = "0.1.0"

# Scénarios déclaratifs (DECISION-0127) : chaque âge et chaque délai du texte
# des deux côtés (veille et jour du dix-huitième anniversaire, 179e et 180e,
# 300e et 301e jours de la période de conception, jour et lendemain du
# vingt-sixième anniversaire) ; les empêchements lus sur de vrais graphes.
[[tests]]
family = "fr.code_civil.famille#famille"
regression = true
