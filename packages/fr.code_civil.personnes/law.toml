version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:code-civil-personnes"

# Métadonnées de catalogue (DECISION-0051 ; docs/PACKAGE-METADATA.ru.md).
[metadata]
act = "fr-code-civil-personnes"
title = "Code civil — Livre Ier, titres Ier à IV et X à XII : droits civils, nationalité, actes de l'état civil, domicile, absents (présomption et déclaration d'absence), minorité, tutelle et émancipation, majeurs protégés, gestion du patrimoine"
