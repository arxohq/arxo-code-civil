# Manifeste §10 — racine du paquet (DECISION-0033). Les en-têtes §22 des
# fichiers .law font foi ; le manifeste doit y correspondre (LDC-E1109).
[package]
name = "fr.code_civil.mayotte"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:code-civil-mayotte"

# Métadonnées de catalogue (DECISION-0051 ; docs/PACKAGE-METADATA.ru.md).
[metadata]
act = "fr-code-civil-mayotte"
title = "Code civil — Livre V : dispositions applicables à Mayotte. Attribution de la nationalité à l'enfant né à Mayotte (2493, 2494), sursis à l'enregistrement de la reconnaissance (2497), immatriculation des immeubles et livre foncier (2511 à 2529), privilèges, hypothèques et formes (2530 à 2532)"
primarySource = "CODE_CIVIL"
jurisdiction = "FR"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "République française ; données ouvertes LEGI diffusées par la DILA"
verifiedAgainstSource = true

# Importations §23 (E-0122) : le seul concentrateur des personnes. Le livre V
# n'emprunte ni le graphe de parenté ni les masses successorales.
[dependencies]
"fr.code_civil.core" = "0.1.0"

# Scénarios déclaratifs (DECISION-0127) : chaque durée du livre V des deux
# côtés (un an de séjour la veille et le jour même, douze ans de bail au mois
# près, six mois de régularisation, deux et trois mois de sursis avec leur
# renouvellement) ; les rangs de l'article 2529 par paires « qui prime qui ».
