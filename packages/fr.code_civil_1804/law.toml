# Manifest §10 — package-root marker (DECISION-0033). Normative headings §22
# live in the .law files; the manifest must match them (LDC-E1109, lawc check).
[package]
name = "fr.code_civil_1804"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:code-civil-1804"

# Catalogue metadata (DECISION-0051). NOT semantics.
[metadata]
act = "fr-code-civil-1804"
title = "Code civil des Français (1804), first edition: property and prescription, intestate succession, contracts, delicts, sale, loan, deposit — slice for the comparative private-law chain"
primarySource = "CC_1804"
jurisdiction = "FR"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
# legalStatus: monument — FIRST edition (DECISION-0091 fork 2); the living
# Code civil is the same act in later texts; the revision axis to it is after F8.
legalStatus = "historical_monument"
issuer = "Corps législatif; promulgué par le Premier Consul Bonaparte (loi du 30 ventôse an XII)"
verifiedAgainstSource = true

