  "tests/03-prescription-1804-expiree.lawtest",
  "tests/04-prescription-1804-expiree-apres-interruption.lawtest",
          "tests/catalog/cc-art1235.lawtest",
          "tests/catalog/cc-art1893.lawtest",
          "tests/catalog/cc-art2280.lawtest",
          "tests/catalog/cc-art724.lawtest",
          "tests/catalog/cc-art743.lawtest",
          "tests/catalog/cc-art767.lawtest"]
world = ["fr.code_civil_1804", "doctrine.ius_privatum"]

[[tests]]
family = "fr.code_civil_1804#successions"
regression = true
suites = [
  "tests/05-successions-deux-enfants-par-tete.lawtest",
  "tests/06-successions-representation-veuve.lawtest",
  "tests/07-successions-enfant-naturel.lawtest",
  "tests/08-successions-conjoint-seul.lawtest",
  "tests/09-successions-reserve-deux-enfants.lawtest",
