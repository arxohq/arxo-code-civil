# Manifeste §10 — racine du paquet (DECISION-0033). Les en-têtes §22 des
# fichiers .law font foi ; le manifeste doit y correspondre (LDC-E1109).
[package]
name = "fr.code_civil.transitions"
version = "0.1.0"
language = "0.2"
namespace = "urn:fr:corpus:clir:code-civil-transitions"

# Métadonnées de catalogue (DECISION-0051 ; docs/PACKAGE-METADATA.ru.md).
# Les unités de ce paquet ne sont PAS des articles du Code : ce sont les
# articles transitoires des réformes elles-mêmes (lois et ordonnances).
[metadata]
act = "fr-code-civil-transitions"
title = "Corridors transitoires des réformes du Code civil : loi n° 2006-728 (successions et libéralités), ordonnance n° 2016-131 et loi n° 2018-287 (contrats et obligations), ordonnance n° 2021-1192 (sûretés) — dates d'entrée en vigueur, survie de la loi ancienne et facteurs de rattachement"
primarySource = "ORDONNANCE_2016_131"
jurisdiction = "FR"
instrument = "statute"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "République française ; données ouvertes LEGI diffusées par la DILA"
verifiedAgainstSource = true

# Scénarios déclaratifs (DECISION-0127) : chaque corridor est éprouvé des deux
