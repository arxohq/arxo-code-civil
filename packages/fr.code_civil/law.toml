# Seconde vague (17 septembre 2026) : titre XX en entier et titre XXI —
# délais particuliers, report, délai butoir, interruption, renonciation,
# aménagement conventionnel, possession et prescription acquisitive. Chaque
# délai est gardé des deux côtés (dernier jour / lendemain). La famille est
# distincte de la démonstration OECD, qui reste intacte.
