<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" role="img"><title>Known findings and missing judicial findings produce different statuses</title><rect width="1280" height="350" rx="24" fill="#f5f0e6"/><text x="40" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162d46">1195 / 1218 — CONSTATATIONS / FINDINGS</text><rect x="40" y="94" width="580" height="210" rx="16" fill="#e3f2ea"/><text x="60" y="138" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#162d46">Constatations fournies / Findings supplied</text><text x="60" y="187" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#162d46">COMPUTED</text><text x="60" y="226" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#162d46">TRUE_ONLY</text><text x="60" y="274" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#162d46">Le modèle conclut à la suspension. / Suspension established.</text><rect x="660" y="94" width="580" height="210" rx="16" fill="#fff0da"/><text x="680" y="138" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#162d46">Constatations absentes / Findings missing</text><text x="680" y="187" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#162d46">REQUIRES_JUDGMENT</text><text x="680" y="226" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#162d46">NEITHER</text><text x="680" y="274" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#162d46">Une absence n’est pas un fait négatif. / Missing is not false.</text></svg>