<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="326" viewBox="0 0 1280 326" role="img"><title>Modèle + faits + date → réponse → preuve</title><rect width="1280" height="326" rx="24" fill="#f5f0e6"/><text x="40" y="55" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#162d46">DE LA QUESTION À LA PREUVE / FROM QUESTION TO PROOF</text><rect x="40" y="95" width="264" height="154" rx="15" fill="white" stroke="#d9dfdf"/><text x="56" y="132" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#162d46">Modèle / Model</text><text x="56" y="178" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162d46">Paquet + édition</text><text x="56" y="213" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162d46">Sources LEGI / pinned text</text><path d="M314 170h25l-7 -7m7 7l-7 7" fill="none" stroke="#b34d3f" stroke-width="3"/><rect x="352" y="95" width="264" height="154" rx="15" fill="white" stroke="#d9dfdf"/><text x="368" y="132" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#162d46">Dossier / Case</text><text x="368" y="178" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162d46">Faits + date juridique</text><text x="368" y="213" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162d46">Constatations explicites</text><path d="M626 170h25l-7 -7m7 7l-7 7" fill="none" stroke="#b34d3f" stroke-width="3"/><rect x="664" y="95" width="264" height="154" rx="15" fill="white" stroke="#d9dfdf"/><text x="680" y="132" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#162d46">Réponse / Answer</text><text x="680" y="178" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162d46">Vérité + statut</text><text x="680" y="213" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162d46">Jugements encore requis</text><path d="M938 170h25l-7 -7m7 7l-7 7" fill="none" stroke="#b34d3f" stroke-width="3"/><rect x="976" y="95" width="264" height="154" rx="15" fill="white" stroke="#d9dfdf"/><text x="992" y="132" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#162d46">Preuve / Proof</text><text x="992" y="178" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162d46">Règles appliquées</text><text x="992" y="213" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162d46">CLIR → articles sources</text><text x="40" y="294" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162d46">Le moteur calcule ; le dossier ne remplace pas le juge. / The engine does not supply the court’s findings.</text></svg>